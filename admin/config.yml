backend:
  name: git-gateway
  branch: master

media_folder: "images/uploads"
public_folder: "/images/uploads"

site_url: https://yomilkatours.com

collections:
  - name: "settings"
    label: "Configuración General"
    files:
      - label: "Información de Contacto"
        name: "contact"
        file: "data/settings.json"
        fields:
          - { label: "Nombre del Sitio", name: "site_name", widget: "string" }
          - { label: "Eslogan", name: "slogan", widget: "text" }
          - { label: "Teléfono 1", name: "phone", widget: "string" }
          - { label: "Teléfono 2", name: "phone2", widget: "string", required: false }
          - { label: "Correo Electrónico", name: "email", widget: "string" }
          - { label: "Dirección", name: "address", widget: "text" }
          - { label: "Horario", name: "hours", widget: "text", hint: "Usa Enter para separar líneas" }
          - { label: "RNC", name: "rnc", widget: "string" }
          - { label: "Enlace de Google Maps", name: "map_url", widget: "string", required: false, hint: "Pega aquí cualquier enlace de Google Maps. Si usas el enlace de 'Incorporar un mapa' se verá el mapa, si no, aparecerá un botón para abrirlo." }
          - { label: "Facebook", name: "facebook", widget: "string", required: false }
          - { label: "Instagram", name: "instagram", widget: "string", required: false }
          - { label: "TikTok", name: "tiktok", widget: "string", required: false }
          - { label: "YouTube", name: "youtube", widget: "string", required: false }
          - { label: "WhatsApp", name: "whatsapp", widget: "string", required: false }

  - name: "hero"
    label: "Slider Principal"
    files:
      - label: "Imágenes del Slider"
        name: "slides"
        file: "data/hero.json"
        fields:
          - label: "Diapositivas"
            name: "slides"
            widget: "list"
            fields:
              - { label: "Imagen", name: "image", widget: "image" }
              - { label: "Título", name: "title", widget: "string" }
              - { label: "Subtítulo", name: "subtitle", widget: "string" }

  - name: "upcoming"
    label: "Próximos Viajes"
    files:
      - label: "Viajes y Excursiones"
        name: "upcoming"
        file: "data/upcoming.json"
        fields:
          - { label: "Título de Sección", name: "title", widget: "string" }
          - { label: "Subtítulo", name: "subtitle", widget: "string" }
          - label: "Viajes"
            name: "items"
            widget: "list"
            fields:
              - { label: "Imagen principal", name: "image", widget: "image", required: false }
              - { label: "Título", name: "title", widget: "string" }
              - { label: "Fecha", name: "date", widget: "string", required: false }
              - { label: "Ubicación", name: "location", widget: "string", required: false }
              - { label: "Duración (ej: 7 días / 6 noches)", name: "duration", widget: "string", required: false }
              - { label: "Precio", name: "price", widget: "string", required: false }
              - { label: "Categoría", name: "category", widget: "string", required: false, hint: "Ej: América, Europa, Caribe, Nacional" }
              - label: "Fechas disponibles"
                name: "dates"
                widget: "list"
                required: false
                fields:
                  - { label: "Salida", name: "departure", widget: "string", hint: "Ej: 15.jun-26 o Todos los fines de semana" }
                  - { label: "Precio", name: "price", widget: "string" }
              - label: "Guía acompañante (opcional)"
                name: "guide"
                widget: "object"
                required: false
                fields:
                  - { label: "Nombre del guía", name: "name", widget: "string", required: false }
                  - { label: "Foto del guía", name: "image", widget: "image", required: false }
                  - { label: "Texto del badge", name: "badge_text", widget: "string", required: false, hint: "Ej: Acompañados del padre Juan" }
              - { label: "Descripción", name: "description", widget: "text", required: false }
              - label: "Itinerario (día a día)"
                name: "itinerary"
                widget: "list"
                required: false
                fields:
                  - { label: "Día", name: "day", widget: "number", required: false }
                  - { label: "Título", name: "title", widget: "string", required: false }
                  - { label: "Descripción", name: "description", widget: "text", required: false }
              - label: "Lugares que visitamos"
                name: "highlights"
                widget: "list"
                required: false
                field: { label: "Lugar", name: "highlight", widget: "string", required: false }
              - label: "Qué incluye"
                name: "included"
                widget: "list"
                required: false
                field: { label: "Item", name: "item", widget: "string", required: false }
              - label: "No incluye"
                name: "not_included"
                widget: "list"
                required: false
                field: { label: "Item", name: "item", widget: "string", required: false }
              - label: "Galería de imágenes (6 fotos)"
                name: "gallery"
                widget: "list"
                required: false
                field: { label: "Imagen", name: "image", widget: "image", required: false }

  - name: "services"
    label: "Servicios"
    files:
      - label: "Nuestros Servicios"
        name: "services"
        file: "data/services.json"
        fields:
          - { label: "Título de Sección", name: "title", widget: "string" }
          - { label: "Subtítulo", name: "subtitle", widget: "string" }
          - label: "Servicios"
            name: "items"
            widget: "list"
            fields:
              - { label: "Icono (nombre)", name: "icon", widget: "select", options: ["visa", "hotel", "tour", "excursion"] }
              - { label: "Título", name: "title", widget: "string" }
              - { label: "Descripción", name: "description", widget: "text" }

  - name: "instagram"
    label: "Instagram"
    files:
      - label: "Publicaciones de Instagram"
        name: "instagram"
        file: "data/instagram.json"
        fields:
          - { label: "Título de Sección", name: "title", widget: "string" }
          - { label: "Subtítulo (usuario)", name: "subtitle", widget: "string" }
          - label: "Publicaciones"
            name: "items"
            widget: "list"
            fields:
              - { label: "Enlace de la publicación de Instagram", name: "embed_url", widget: "string", hint: "Copia y pega aquí el enlace de la publicación. Ejemplo: https://www.instagram.com/p/ABC123/" }

  - name: "partners"
    label: "Aliados"
    files:
      - label: "Empresas Aliadas"
        name: "partners"
        file: "data/partners.json"
        fields:
          - { label: "Título de Sección", name: "title", widget: "string" }
          - label: "Empresas"
            name: "items"
            widget: "list"
            fields:
              - { label: "Nombre", name: "name", widget: "string" }
              - { label: "Logo", name: "logo", widget: "image" }
